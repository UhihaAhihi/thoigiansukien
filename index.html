<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Thời Gian Đến Các Sự Kiện</title>
    <!-- Google Fonts & FontAwesome cho Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-secondary: #6b7280;
            --accent-color: #ec4899;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin: 10px 0 25px 0;
            font-size: 28px;
            font-weight: 700;
            width: 100%;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-button {
            background-color: #10b981;
            color: white;
            text-decoration: none;
        }
        .back-button:hover {
            background-color: #059669;
        }

        .main-btn {
            background-color: var(--primary-color);
            color: #fff;
            width: 100%;
            justify-content: center;
            font-size: 16px;
            padding: 12px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .main-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .search-box:focus {
            border-color: var(--primary-color);
        }

        .event-list {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
            display: grid;
            gap: 15px;
        }

        .event-item {
            background: #f9fafb;
            padding: 16px 20px;
            border-radius: 12px;
            border-left: 5px solid var(--primary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .event-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        /* Nổi bật sự kiện gần nhất */
        .event-item.nearest {
            background: #fff5f7;
            border-left-color: var(--accent-color);
        }

        .event-info {
            flex: 1;
            min-width: 250px;
        }

        .event-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-color);
            display: block;
            margin-bottom: 4px;
        }

        .event-date {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .event-countdown {
            text-align: right;
            font-weight: 500;
            font-size: 14px;
        }

        .badge-days {
            background: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            display: inline-block;
        }

        .nearest .badge-days {
            background: var(--accent-color);
        }

        .event-details {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .event-countdown {
                text-align: left;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <a href="ngày sinh.html" class="btn back-button"><i class="fa-solid fa-arrow-left"></i> Quay lại trang Ngày Sinh</a>
        </div>
        
        <h1><i class="fa-solid fa-hourglass-half"></i> Tính Thời Gian Đến Các Sự Kiện</h1>
        
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Tìm kiếm sự kiện..." onkeyup="filterEvents()">
        
        <button class="btn main-btn" onclick="calculateUpcomingEvents()"><i class="fa-solid fa-calculator"></i> Tính Toán Ngay</button>
        
        <ul class="event-list" id="eventList">
            <!-- Dữ liệu sự kiện sẽ được render tự động vào đây -->
        </ul>
    </div>

    <script>
        // Danh sách sự kiện dùng định dạng tháng-ngày (MM-DD) để tự động cập nhật theo năm hiện tại
        const events = [
            { name: "Tết Nguyên Đán", monthDay: "01-29" }, // Lưu ý: Tết Âm lịch có thể thay đổi theo năm, đây tạm tính theo dữ liệu mẫu hoặc bạn có thể cập nhật động
            { name: "Tết Trung Thu (Dưới 14 tuổi mới đc nhận quà)", monthDay: "10-06" },
            { name: "Tết Đoan Ngọ", monthDay: "05-31" },
            { name: "Ngày Quốc Khánh", monthDay: "09-02" },
            { name: "Ngày Giải Phóng Miền Nam", monthDay: "04-30" },
            { name: "Ngày Nhà Giáo Việt Nam", monthDay: "11-20" },
            { name: "Ngày Quốc Tế Phụ Nữ (Theo tin đồn 19/11 là ngày qte đàn ông)", monthDay: "03-08" },
            { name: "Ngày Quốc Tế Lao Động (GV nghỉ dạy, HS nghỉ học)", monthDay: "05-01" },
            { name: "Ngày Thương Binh Liệt Sĩ", monthDay: "07-27" },
            { name: "Tết Dương Lịch", monthDay: "01-01" },
            { name: "Lễ Phục Sinh", monthDay: "04-20" },
            { name: "Ngày Halloween (Ngày hội cosplay)", monthDay: "10-31" },
            { name: "Ngày Valentine (Nếu có bồ)", monthDay: "02-14" },
            { name: "Ngày Cá Tháng Tư", monthDay: "04-01" },
            { name: "Lễ Giáng Sinh", monthDay: "12-25" }
        ];

        let allEventsComputed = [];

        function calculateUpcomingEvents() {
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Đặt về 0h để tính chính xác theo ngày

            allEventsComputed = events.map(event => {
                const currentYear = today.getFullYear();
                let [month, day] = event.monthDay.split('-');
                let eventDate = new Date(currentYear, month - 1, day);

                // Nếu sự kiện trong năm nay đã qua, tính cho năm sau
                if (eventDate < today) {
                    eventDate.setFullYear(currentYear + 1);
                }

                const timeDiff = eventDate - today;
                const daysDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
                const weeksDiff = Math.floor(daysDiff / 7);
                const monthsDiff = (eventDate.getFullYear() - today.getFullYear()) * 12 + (eventDate.getMonth() - today.getMonth());

                return {
                    ...event,
                    eventDate: eventDate,
                    daysLeft: daysDiff,
                    weeksLeft: weeksDiff,
                    monthsLeft: Math.max(0, monthsDiff)
                };
            });

            // Sắp xếp sự kiện từ gần nhất đến xa nhất
            allEventsComputed.sort((a, b) => a.eventDate - b.eventDate);

            renderEvents(allEventsComputed);
        }

        function renderEvents(eventsToRender) {
            const eventList = document.getElementById('eventList');
            eventList.innerHTML = '';

            if (eventsToRender.length === 0) {
                eventList.innerHTML = '<li style="text-align: center; color: #6b7280; padding: 20px;">Không tìm thấy sự kiện phù hợp!</li>';
                return;
            }

            eventsToRender.forEach((event, index) => {
                const li = document.createElement('li');
                // Đánh dấu sự kiện đầu tiên (gần nhất)
                const isNearest = index === 0;
                li.className = `event-item ${isNearest ? 'nearest' : ''}`;

                li.innerHTML = `
                    <div class="event-info">
                        <span class="event-name">${event.name} ${isNearest ? '🔥 (Sắp tới gần nhất)' : ''}</span>
                        <span class="event-date"><i class="fa-regular fa-calendar"></i> ${event.eventDate.toLocaleDateString('vi-VN')}</span>
                    </div>
                    <div class="event-countdown">
                        <span class="badge-days">${event.daysLeft === 0 ? 'Hôm nay!' : `${event.daysLeft} ngày nữa`}</span>
                        <div class="event-details">(${event.weeksLeft} tuần, khoảng ${event.monthsLeft} tháng)</div>
                    </div>
                `;
                eventList.appendChild(li);
            });
        }

        function filterEvents() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allEventsComputed.filter(event => 
                event.name.toLowerCase().includes(keyword)
            );
            renderEvents(filtered);
        }

        // Tự động tính toán luôn khi vừa mở trang
        window.onload = function() {
            calculateUpcomingEvents();
        };
    </script>
</body>
</html>
