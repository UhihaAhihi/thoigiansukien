<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Sự Kiện & Khám Phá Ngày Sinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-secondary: #6b7280;
            --accent-color: #ec4899;
            --border-color: #e5e7eb;
        }

        [data-theme="dark"] {
            --primary-color: #818cf8;
            --primary-hover: #6366f1;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #1e293b;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #334155;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .tab-btn { background-color: #e5e7eb; color: var(--text-color); }
        .tab-btn.active { background-color: var(--primary-color); color: white; }
        .theme-btn { background-color: #f59e0b; color: white; }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin: 10px 0 25px 0;
            font-size: 26px;
            font-weight: 700;
        }

        .section-view { display: none; }
        .section-view.active { display: block; animation: fadeIn 0.4s ease-in-out; }

        /* Style cho phần Sự Kiện */
        .live-countdown-banner {
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(99,102,241,0.3);
        }
        .live-countdown-banner h3 { margin: 0 0 10px 0; font-size: 17px; }
        .countdown-timers { display: flex; justify-content: center; gap: 12px; font-weight: 700; font-size: 20px; }
        .time-box { background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 8px; min-width: 45px; }
        .time-box span { font-size: 11px; display: block; font-weight: 400; opacity: 0.8; }

        .add-event-box {
            background: rgba(99, 102, 241, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .add-event-box input {
            flex: 1;
            min-width: 180px;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
        }
        .add-btn { background-color: var(--accent-color); color: white; }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .event-list { list-style-type: none; padding: 0; display: grid; gap: 12px; }
        .event-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 5px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .event-item.nearest { border-left-color: var(--accent-color); background: rgba(236, 72, 153, 0.03); }
        .event-name { font-weight: 600; font-size: 15px; display: block; margin-bottom: 3px; }
        .event-date { color: var(--text-secondary); font-size: 13px; }
        .badge-days { background: var(--primary-color); color: white; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .nearest .badge-days { background: var(--accent-color); }
        .event-details { font-size: 11px; color: var(--text-secondary); margin-top: 3px; text-align: right; }

        /* Style cho phần Ngày Sinh & Bói */
        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group label { font-weight: 600; color: var(--text-color); }
        .input-group input, .input-group select {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
        }
        .match-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .main-btn {
            background-color: var(--primary-color);
            color: #fff;
            width: 100%;
            justify-content: center;
            font-size: 16px;
            padding: 12px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            margin-bottom: 20px;
        }
        .result-card {
            background: rgba(139, 92, 246, 0.03);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 5px solid var(--primary-color);
        }
        .result-card h3 { margin-top: 0; color: var(--primary-color); display: flex; align-items: center; gap: 10px; font-size: 16px; }
        .tarot-card { border-left-color: var(--accent-color); background: rgba(236, 72, 153, 0.03); }
        .tarot-card h3 { color: var(--accent-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Thanh điều hướng các tab -->
        <div class="top-bar">
            <div class="tab-buttons">
                <button class="btn tab-btn active" onclick="switchTab('events')"><i class="fa-solid fa-calendar-days"></i> Sự Kiện</button>
                <button class="btn tab-btn" onclick="switchTab('birthday')"><i class="fa-solid fa-wand-magic-sparkles"></i> Ngày Sinh & Bói</button>
            </div>
            <button class="btn theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Giao diện</button>
        </div>

        <!-- TAB 1: SỰ KIỆN -->
        <div id="eventsSection" class="section-view active">
            <h1>Tính Thời Gian Đến Các Sự Kiện</h1>
            
            <div class="live-countdown-banner" id="liveBanner">
                <h3 id="nearestTitle">Đang tải sự kiện gần nhất...</h3>
                <div class="countdown-timers">
                    <div class="time-box"><span id="days">00</span><span>Ngày</span></div>
                    <div class="time-box"><span id="hours">00</span><span>Giờ</span></div>
                    <div class="time-box"><span id="minutes">00</span><span>Phút</span></div>
                    <div class="time-box"><span id="seconds">00</span><span>Giây</span></div>
                </div>
            </div>

            <div class="add-event-box">
                <input type="text" id="customName" placeholder="Tên sự kiện (VD: Hẹn hò crush)...">
                <input type="date" id="customDate">
                <button class="btn add-btn" onclick="addCustomEvent()"><i class="fa-solid fa-plus"></i> Thêm</button>
            </div>
            
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Tìm kiếm sự kiện..." onkeyup="filterEvents()">
            
            <ul class="event-list" id="eventList"></ul>
        </div>

        <!-- TAB 2: NGÀY SINH & BÓI VUI -->
        <div id="birthdaySection" class="section-view">
            <h1>Khám Phá Ngày Sinh & Coi Bói Vui</h1>
            
            <div class="input-group">
                <label for="dobInput">Ngày sinh của bạn (DD/MM/YYYY):</label>
                <input type="text" id="dobInput" placeholder="Ví dụ: 22/02/2008" maxlength="10">
            </div>

            <div class="input-group">
                <label>So độ hợp cung hoàng đạo với bạn bè/crush:</label>
                <div class="match-box">
                    <select id="partnerSign" style="flex: 1;">
                        <option value="">-- Chọn cung của người ấy --</option>
                        <option value="Bảo Bình">Bảo Bình (♒)</option>
                        <option value="Song Ngư">Song Ngư (♓)</option>
                        <option value="Bạch Dương">Bạch Dương (♈)</option>
                        <option value="Kim Ngưu">Kim Ngưu (♉)</option>
                        <option value="Song Tử">Song Tử (♊)</option>
                        <option value="Cự Giải">Cự Giải (♋)</option>
                        <option value="Sư Tử">Sư Tử (♌)</option>
                        <option value="Xử Nữ">Xử Nữ (♍)</option>
                        <option value="Thiên Bình">Thiên Bình (♎)</option>
                        <option value="Bọ Cạp">Bọ Cạp (♏)</option>
                        <option value="Nhân Mã">Nhân Mã (♐)</option>
                        <option value="Ma Kết">Ma Kết (♑)</option>
                    </select>
                </div>
            </div>
            
            <button class="btn main-btn" onclick="analyzeBirthdate()"><i class="fa-solid fa-crystal-ball"></i> Khám Phá Ngay</button>
            
            <div class="result-section" id="resultSection" style="display:none;">
                <div class="result-card">
                    <h3><i class="fa-solid fa-clock"></i> Thời Gian Sống & Chỉ Số Vui Nhộn</h3>
                    <p id="lifeStats"></p>
                </div>

                <div class="result-card">
                    <h3><i class="fa-solid fa-star"></i> Cung Hoàng Đạo & Thần Số Học</h3>
                    <p id="zodiacInfo"></p>
                </div>

                <div class="result-card" id="matchCard" style="display:none;">
                    <h3><i class="fa-solid fa-heart-pulse"></i> Tỷ Lệ Hợp Đôi</h3>
                    <p id="matchInfo"></p>
                </div>

                <div class="result-card">
                    <h3><i class="fa-solid fa-face-smile-beam"></i> Góc Coi Bói Vui (Tử Vi Cười)</h3>
                    <p id="fortuneInfo"></p>
                </div>

                <div class="result-card tarot-card">
                    <h3><i class="fa-solid fa-hat-wizard"></i> Lá Bài Tarot Hôm Nay</h3>
                    <p id="tarotInfo"></p>
                </div>

                <button class="btn" style="background:#10b981; color:white; width:100%; justify-content:center;" onclick="copyResult()"><i class="fa-solid fa-copy"></i> Sao chép kết quả gửi bạn bè</button>
            </div>
        </div>
    </div>

    <script>
        // Chuyển tab
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
            if(tab === 'events') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('eventsSection').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('birthdaySection').classList.add('active');
            }
        }

        // Logic Sự Kiện
        const defaultEvents = [
            { name: "Tết Nguyên Đán", monthDay: "01-29" },
            { name: "Tết Trung Thu (Dưới 14 tuổi mới đc nhận quà)", monthDay: "10-06" },
            { name: "Ngày Quốc Khánh", monthDay: "09-02" },
            { name: "Ngày Giải Phóng Miền Nam", monthDay: "04-30" },
            { name: "Ngày Nhà Giáo Việt Nam", monthDay: "11-20" },
            { name: "Ngày Quốc Tế Phụ Nữ", monthDay: "03-08" },
            { name: "Ngày Quốc Tế Lao Động", monthDay: "05-01" },
            { name: "Tết Dương Lịch", monthDay: "01-01" },
            { name: "Ngày Halloween (Ngày hội cosplay)", monthDay: "10-31" },
            { name: "Ngày Valentine (Nếu có bồ)", monthDay: "02-14" },
            { name: "Lễ Giáng Sinh", monthDay: "12-25" }
        ];

        let allEventsComputed = [];
        let countdownInterval;

        function getSavedCustomEvents() {
            const saved = localStorage.getItem('myCustomEvents');
            return saved ? JSON.parse(saved) : [];
        }

        function calculateUpcomingEvents() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const custom = getSavedCustomEvents();
            let mappedDefaults = defaultEvents.map(event => {
                const currentYear = today.getFullYear();
                let [month, day] = event.monthDay.split('-');
                let eventDate = new Date(currentYear, month - 1, day);
                if (eventDate < today) eventDate.setFullYear(currentYear + 1);
                return { ...event, eventDate };
            });

            let mappedCustom = custom.map(event => {
                let eventDate = new Date(event.date);
                eventDate.setHours(0,0,0,0);
                return { name: "📌 " + event.name, eventDate };
            });

            let combined = [...mappedDefaults, ...mappedCustom].map(event => {
                const timeDiff = event.eventDate - today;
                const daysDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
                const weeksDiff = Math.floor(daysDiff / 7);
                const monthsDiff = (event.eventDate.getFullYear() - today.getFullYear()) * 12 + (event.eventDate.getMonth() - today.getMonth());
                return { ...event, daysLeft: Math.max(0, daysDiff), weeksLeft: weeksDiff, monthsLeft: Math.max(0, monthsDiff) };
            });

            combined.sort((a, b) => a.eventDate - b.eventDate);
            allEventsComputed = combined;

            renderEvents(allEventsComputed);
            startLiveCountdown(allEventsComputed[0]);
        }

        function renderEvents(eventsToRender) {
            const eventList = document.getElementById('eventList');
            eventList.innerHTML = '';

            if (eventsToRender.length === 0) {
                eventList.innerHTML = '<li style="text-align: center; color: var(--text-secondary); padding: 20px;">Không có sự kiện nào!</li>';
                return;
            }

            eventsToRender.forEach((event, index) => {
                const li = document.createElement('li');
                const isNearest = index === 0;
                li.className = `event-item ${isNearest ? 'nearest' : ''}`;

                li.innerHTML = `
                    <div class="event-info">
                        <span class="event-name">${event.name} ${isNearest ? '🔥 (Sắp tới)' : ''}</span>
                        <span class="event-date"><i class="fa-regular fa-calendar"></i> ${event.eventDate.toLocaleDateString('vi-VN')}</span>
                    </div>
                    <div class="event-countdown">
                        <span class="badge-days" onclick="triggerFireworks()">${event.daysLeft === 0 ? 'Hôm nay! (Bấm pháo hoa 🎉)' : `${event.daysLeft} ngày nữa`}</span>
                        <div class="event-details">(${event.weeksLeft} tuần, khoảng ${event.monthsLeft} tháng)</div>
                    </div>
                `;
                eventList.appendChild(li);
            });
        }

        function addCustomEvent() {
            const name = document.getElementById('customName').value.trim();
            const date = document.getElementById('customDate').value;
            if (!name || !date) {
                alert('Vui lòng nhập đủ tên và ngày sự kiện!');
                return;
            }
            const custom = getSavedCustomEvents();
            custom.push({ name, date });
            localStorage.setItem('myCustomEvents', JSON.stringify(custom));
            document.getElementById('customName').value = '';
            document.getElementById('customDate').value = '';
            calculateUpcomingEvents();
        }

        function startLiveCountdown(nearestEvent) {
            if (!nearestEvent) return;
            document.getElementById('nearestTitle').innerHTML = `Đếm ngược đến: <b>${nearestEvent.name}</b>`;
            if (countdownInterval) clearInterval(countdownInterval);

            const targetTime = new Date(nearestEvent.eventDate).getTime();
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance < 0) return;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            }, 1000);
        }

        function triggerFireworks() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }

        function filterEvents() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allEventsComputed.filter(e => e.name.toLowerCase().includes(keyword));
            renderEvents(filtered);
        }

        // Logic Ngày Sinh & Bói
        const dobInput = document.getElementById('dobInput');
        dobInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2 && value.length <= 4) value = value.slice(0, 2) + '/' + value.slice(2);
            else if (value.length > 4) value = value.slice(0, 2) + '/' + value.slice(2, 4) + '/' + value.slice(4, 8);
            e.target.value = value;
        });

        function analyzeBirthdate() {
            const val = dobInput.value;
            const parts = val.split('/');
            if (parts.length !== 3) {
                alert('Vui lòng nhập đúng định dạng DD/MM/YYYY nhé!');
                return;
            }

            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);
            const birthDate = new Date(year, month - 1, day);
            const today = new Date();

            if (isNaN(birthDate.getTime()) || birthDate > today) {
                alert('Ngày sinh không hợp lệ!');
                return;
            }

            const diffTime = Math.abs(today - birthDate);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);
            const milkTea = Math.floor(diffDays / 4);
            const oxygen = Math.floor(diffDays * 11);

            document.getElementById('lifeStats').innerHTML = `
                ✨ Đã sống: <b>${diffDays.toLocaleString()}</b> ngày (${diffWeeks.toLocaleString()} tuần).<br>
                🧋 Đã tiêu thụ khoảng: <b>${milkTea.toLocaleString()}</b> ly trà sữa.<br>
                💨 Đã hít thở khoảng: <b>${oxygen.toLocaleString()}</b> m³ oxy.
            `;

            const zodiac = getZodiacSign(day, month);
            const lifePathNumber = calculateNumerology(day, month, year);

            document.getElementById('zodiacInfo').innerHTML = `
                Cung: <b>${zodiac.name}</b> (${zodiac.symbol}) - ${zodiac.trait}<br>
                🔢 <b>Thần số học (Con số chủ đạo): Số ${lifePathNumber}</b>
            `;

            const partner = document.getElementById('partnerSign').value;
            const matchCard = document.getElementById('matchCard');
            if (partner) {
                matchCard.style.display = 'block';
                const score = Math.floor((Math.abs(zodiac.name.length * partner.length * year) % 51) + 50);
                document.getElementById('matchInfo').innerHTML = `Độ tương hợp giữa <b>${zodiac.name}</b> và <b>${partner}</b> đạt: <span style="color:var(--accent-color); font-size:18px; font-weight:bold;">${score}%</span>. Hai bạn đích thị là mảnh ghép hoàn hảo!`;
            } else {
                matchCard.style.display = 'none';
            }

            const fortunes = [
                "Tướng tinh con mèo lười: Cuộc đời sinh ra để hưởng thụ giấc ngủ ngon, tiền tài chậm đến nhưng đồ ăn ngon không bao giờ trễ hẹn.",
                "Dự báo thời tiết tâm hồn: Sắp tới trời sẽ mưa ra tiền, nhưng ví của bạn đang ủng hộ phong trào 'ví rỗng tinh tế'!",
                "Đường tình duyên: Rất sáng sủa, đặc biệt là tình duyên với máy tính và mạng Internet!"
            ];
            document.getElementById('fortuneInfo').innerHTML = fortunes[(year + month + day) % fortunes.length];

            const tarotCards = [
                "<b>The Fool (Kẻ Khờ - Ngược):</b> Trước khi làm gì nhớ suy nghĩ 3 giây thay vì lao đầu vào chọn bừa đáp án trắc nghiệm.",
                "<b>The Magician (Pháp Sư - Xuôi):</b> Bạn đang có đầy đủ năng lực để làm chủ tình thế. Hôm nay làm gì cũng thuận lợi!",
                "<b>The Wheel of Fortune (Bánh Xe Vận Mệnh):</b> Vận may đang xoay chuyển về phía bạn. Làm bài kiểm tra chắc chắn trúng tủ!"
            ];
            document.getElementById('tarotInfo').innerHTML = tarotCards[(year * month * day) % tarotCards.length];

            document.getElementById('resultSection').style.display = 'block';
        }

        function calculateNumerology(d, m, y) {
            let sum = String(d) + String(m) + String(y);
            while (sum.length > 1 && sum != '11' && sum != '22' && sum != '33') {
                sum = String(sum.split('').reduce((a, b) => parseInt(a) + parseInt(b), 0));
            }
            return sum;
        }

        function getZodiacSign(day, month) {
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return { name: "Bảo Bình", symbol: "♒", trait: "Thông minh, độc lập." };

            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return { name: "Bạch Dương", symbol: "♈", trait: "Năng động, nhiệt huyết." };
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return { name: "Kim Ngưu", symbol: "♉", trait: "Thực tế, kiên định." };

        function copyResult() {
            const text = document.getElementById('resultSection').innerText;
            navigator.clipboard.writeText(text);
            alert('Đã sao chép kết quả! Mang đi gửi bạn bè ngay thôi 🚀');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            if (current === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        window.onload = function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            calculateUpcomingEvents();
        };
    </script>
